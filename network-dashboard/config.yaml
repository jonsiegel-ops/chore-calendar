name: Network Dashboard
version: "2.0.0"
slug: network_dashboard
description: Live UniFi network dashboard - WAN, gateway, devices and clients, all from your controller
url: https://github.com/jonsiegel-ops/chore-calendar
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# Host networking lets the app see the real LAN (ARP table, ping sweep, throughput).
host_network: true
webui: "http://[HOST]:[PORT:8081]/"
ports:
  8081/tcp: 8081
ports_description:
  8081/tcp: Network dashboard web page
options:
  unifi_url: ""
  unifi_username: ""
  unifi_password: ""
  unifi_site: default
  unifi_os: true
  unifi_verify_ssl: false
schema:
  unifi_url: str?
  unifi_username: str?
  unifi_password: password?
  unifi_site: str?
  unifi_os: bool?
  unifi_verify_ssl: bool?
