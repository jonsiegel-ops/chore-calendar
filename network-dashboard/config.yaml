name: Network Dashboard
version: "1.0.0"
slug: network_dashboard
description: Live view of your home network - devices, internet health, latency and Pi stats
url: https://github.com/jonsiegel-ops/chore-calendar
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# Host networking lets the app see the real LAN (ARP table, ping sweep, throughput).
host_network: true
webui: "http://[HOST]:[PORT:8081]/"
ports:
  8081/tcp: 8081
ports_description:
  8081/tcp: Network dashboard web page
