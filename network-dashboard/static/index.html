<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Network Dashboard</title><link rel="stylesheet" href="style.css">
</head><body>
<header><h1>🌐 Network</h1><span id="updated" class="muted"></span></header>
<main>
  <section class="tiles" id="tiles"></section>
  <section class="card"><h2>Latency</h2><div id="monitors"></div>
    <form id="addMon" class="row">
      <input name="name" placeholder="Name"><select name="type"><option>ping</option><option>tcp</option><option>http</option></select>
      <input name="host" placeholder="Host or URL" required><input name="port" placeholder="Port" size="5" class="port">
      <button>+ Add monitor</button></form></section>
  <section class="card"><h2>Throughput</h2><div id="net"></div></section>
  <section class="card"><h2>This Pi</h2><div id="sys"></div></section>
  <section class="card wide"><div class="row between"><h2>Devices <span id="devCount" class="muted"></span></h2>
    <div class="row"><input id="filter" placeholder="Search…"><button id="scan">Scan now</button></div></div>
    <div class="muted" id="scanInfo"></div>
    <div class="tablewrap"><table><thead><tr><th></th><th>Name</th><th>IP</th><th>MAC / vendor</th><th>Ping</th><th>Last seen</th><th></th></tr></thead><tbody id="devs"></tbody></table></div>
  </section>
</main>
<script src="app.js"></script></body></html>
