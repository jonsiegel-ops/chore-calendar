name: Chore Chart
version: "1.5.0"
slug: chore_chart
description: Touch-friendly kids chore chart for a fridge or wall display
url: https://github.com/jonsiegel-ops/chore-calendar
arch:
  - aarch64
  - amd64
startup: application
# Lets the app read calendars that Home Assistant knows about (e.g. private iCloud
# calendars added with the CalDAV integration). No other access is used.
homeassistant_api: true
boot: auto
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Chore chart web page (open this on the fridge)
webui: "http://[HOST]:[PORT:8080]/"
