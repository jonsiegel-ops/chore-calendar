<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Chore Chart</title>
  <link rel="stylesheet" href="style.css">
  <script src="fit.js"></script>
</head>
<body data-screensaver>
  <header class="top">
    <h1 id="title">Chore Chart</h1>
    <nav class="nav">
      <a class="nav-btn" href="/calendar">📅 Calendar</a>
      <a class="nav-btn" href="/stats">📊 This week</a>
      <a class="nav-btn icon-only" href="/admin" aria-label="Settings">⚙️</a>
    </nav>
    <div class="when">
      <div id="day" class="day"></div>
      <div id="clock" class="clock"></div>
    </div>
  </header>

  <a id="today-cal" class="today-cal" href="/calendar" hidden>
    <div class="today-cal-head">
      <div class="today-cal-title">📅 Today</div>
      <div id="weather" class="weather" hidden></div>
    </div>
    <div id="today-events" class="today-events" hidden></div>
    <div id="countdowns" class="countdowns" hidden></div>
  </a>

  <main id="board" class="board"></main>

  <div id="offline" class="offline" hidden>Can't reach the chore server — retrying…</div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <script src="display.js"></script>
  <script src="app.js"></script>
</body>
</html>
